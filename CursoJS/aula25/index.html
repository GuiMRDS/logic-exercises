<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>IMC</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <section class="container">
      <h1>Tabela IMC</h1>

      <table>
        <h4>IMC</h4>
        <p>Menor do que 18,5</p>
        <p>Entre 18,5 e 24,9</p>
        <p>Entre 25 e 29,9</p>
        <p>Entre 30 e 34,9</p>
        <p>Entre 35 e 39,9</p>
        <p>Mais do que 40</p>
      </table>

      <table>
        <h4>Resultado</h4>
        <p>Abaixo do peso</p>
        <p>Peso normal</p>
        <p>Sobrepeso</p>
        <p>Obesidade grau 1</p>
        <p>Obesidade grau 2</p>
        <p>Obesidade grau 3</p>
      </table>

      <form action="" class="formulario">
        <h1>Calcule seu IMC</h1>

        <label for="input-teste-1">Peso: </label>
        <input type="number" id="input-teste-1" />

        <label for="input-teste-2">Altura: </label>
        <input type="number" id="input-teste-2" />

        <button>Enviar</button>
      </form>
    </section>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
